name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fork PRs get a read-only token and no access to repository secrets, so they
# can validate the build but never publish.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and content
        run: npm run check

      - name: Setup Python for documentation contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned documentation reference
        run: |
          python -m venv .venv-docs
          python - <<'PYCODE'
          import json
          import subprocess
          config = json.load(open('scripts/docs-contracts.json'))
          subprocess.check_call([
              '.venv-docs/bin/python', '-m', 'pip', 'install',
              'sparkrun @ git+' + config['repository'] + '@' + config['revision'],
          ])
          PYCODE

      - name: Verify documentation contracts offline
        run: |
          for channel in stable beta alpha; do
            for advanced in 0 1; do
              .venv-docs/bin/python scripts/check-docs-contracts.py --channel "$channel" --advanced "$advanced"
            done
          done

      - name: Build
        run: npm run build

      - name: Check built links and navigation
        run: npm run check:links

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
